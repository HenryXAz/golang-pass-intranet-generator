<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
</head>
<body> 
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111;
            color: #eee;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            text-align: center;
            margin: .8em;
        }

        label {
            display: inline-block;
            width: 100%;
        }

        input {
            display: inline-block;
            width: 100%;
            margin: .8em;
            padding: .8em;
            background-color: #444;
            color: #eee;
            outline: none;
            border: 1px solid #51a2ff;
            border-radius: .8em;
            font-size: 1em;
        }

        button {
            background-color: #155dfc;
            color: #eee;
            border: none;
            outline: none;
            padding: .8em;
            border-radius: .8em;
            font-weight: 700;
        }

        p {
            padding: .8em;
            margin: .8em auto;
            width:  100%;
            border: 1px solid #555;
            border-radius: .8em;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            margin: 2em auto;
            padding: .8em;
            background-color: #222;
        }

        .form-container {
            margin: 1em auto;
            padding: 2em;
            border: 1px solid #555;
            border-radius: .8em;
        }

        .result-container {
            display: inline-block;
            padding: 1em;
            color: #fff;
            background-color: #444;
            border-radius: .8em;
        }

        .clipboard {
            width: 25px;
            display: inline-block;
        }

        .clipboard-button {
            background-color: #333;
            padding: .8em;
        }

        .clipboard-button:hover {
            background-color: #222;
            cursor: pointer; 
        }

        .danger {
            background-color: #c10007;
            color: #eee;
            border-radius: .8em;
            padding: .8em;
        }

        .hidden {
            display: none;
        }

        .padlock-container {
            padding: .8em;
            background-color: rgba(81, 162, 255, 0.2);
            height: 60px;
            margin-right: .5em;
            border-radius: .8em;
        }

        .header-container {
            display: flex;
            width: 100%; 
            gap: 1em;
            justify-content: space-between;
        }

        .right-header-container {
            display: grid;
            align-items: center;
            grid-template-columns: 1fr 10fr;
        }

        .title-container {
            margin: .8em;
        }

        .header-p {
            border: none;
        }

    </style>

    <div class="container">
 
    <p class="danger hidden" id="error-card">
        ⚠ Something went wrong, verify logs 
    </p>

    <div class="header-container" >
        <div class="right-header-container" >
            <div class="padlock-container">
                <svg width="30px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#51a2ff"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M8.1819 10.7027H6.00008C5.44781 10.7027 5.0001 11.1485 5.00009 11.7008C5.00005 13.3483 5 16.6772 5.00011 18.9189C5.00023 21.4317 8.88618 22 12 22C15.1139 22 19 21.4317 19 18.9189C19 16.6773 19 13.3483 19 11.7008C19 11.1485 18.5523 10.7027 18 10.7027H15.8182M8.1819 10.7027C8.1819 10.7027 8.18193 8.13514 8.1819 6.59459C8.18186 4.74571 9.70887 3 12 3C14.2912 3 15.8182 4.74571 15.8182 6.59459C15.8182 8.13514 15.8182 10.7027 15.8182 10.7027M8.1819 10.7027H15.8182" stroke="#51a2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> <path fill-rule="evenodd" clip-rule="evenodd" d="M13 16.6181V18C13 18.5523 12.5523 19 12 19C11.4477 19 11 18.5523 11 18V16.6181C10.6931 16.3434 10.5 15.9442 10.5 15.5C10.5 14.6716 11.1716 14 12 14C12.8284 14 13.5 14.6716 13.5 15.5C13.5 15.9442 13.3069 16.3434 13 16.6181Z" fill="#51a2ff"></path> </g></svg>
            </div>
            <div>
                <h1 style="text-align: left; padding: 0; margin: 0" >Password Session Generator</h1>
                <p style="padding: 0; margin: 0; border:none;">
                Generate the values to authentication in dev environment
            </p>
            </div>
        </div>
        <div>
            <h2>Secure</h2>
            <p>Only for dev environment</p>
        </div>
    </div>



    <div class="form-container">
        <form method="POST" action="">
            <label for="plain_pass">
                Ingrese contraseña:
                <input type="text" id="plain_pass" name="plain_pass" />
            </label>

            <div class="button-container">
                <button type="submit">
                    Generate
                </button>
            </div>
        </form>     
    </div>


    {{ if ne .Sha256  "" }}    
        <p>Value to session 
            <span class="result-container" id="sha256-pass">{{.Sha256}}
                <button type="button" class="clipboard-button" id="sha256-button"
                    onclick="copyTextToClipboard('sha256-button', 'sha256-pass')"
                >
                    Copy
                </button>
            </span>
        </p>
    {{ end }}

    {{ if ne .BcryptPass ""}}
        <p>Value to database 
            <span class="result-container" id="bcrypt-pass">{{ .BcryptPass }}
                <button type="button" class="clipboard-button" id="bcrypt-button"
                onclick="copyTextToClipboard('bcrypt-button', 'bcrypt-pass')"
                >
                    Copy
                </button>
            </span>
        </p>
    {{ end }}
    </div>

    <script src="/static/main.js" defer></script>
</body> 
</html>
